services:
  - type: web
    name: windowpane
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ALLOW_ORIGIN
        value: https://sitev2.github.io
      - key: PASSWORD
        sync: false   # you type this in on Render's dashboard
