<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windowpane</title>
<style>
/* Layout: one-screen app. Tab strip on top, toolbar, bookmarks bar, full-height page area. */
:root{
  --bg:#1b1d22; --tab:#262930; --tab-on:#30343d; --ink:#e8eaee; --muted:#8b91a0;
  --line:#383c47; --accent:#6aa9ff; --bar:#14161a;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
@media (prefers-color-scheme:light){
  :root{--bg:#dfe3ea;--tab:#cdd2dc;--tab-on:#f4f6fa;--ink:#1c2029;--muted:#667085;--line:#b9c0cd;--accent:#1f6feb;--bar:#fff}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px var(--font);color-scheme:dark light}
#app{display:flex;flex-direction:column;height:100%}
#tabs{display:flex;gap:2px;padding:8px 8px 0;align-items:flex-end;overflow-x:auto;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:8px;min-width:120px;max-width:220px;flex:1 1 180px;padding:8px 10px;
  background:var(--tab);border-radius:9px 9px 0 0;cursor:default;position:relative;user-select:none}
.tab.on{background:var(--tab-on)}
.tab span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab button{all:unset;cursor:pointer;width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;color:var(--muted)}
.tab button:hover{background:var(--line);color:var(--ink)}
#newtab{all:unset;cursor:pointer;width:30px;height:30px;text-align:center;line-height:28px;border-radius:50%;font-size:20px;color:var(--muted);flex:none;margin-bottom:3px}
#newtab:hover{background:var(--tab)}
#toolbar{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--tab-on)}
.ib{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--ink);font-size:17px}
.ib:hover{background:var(--line)} .ib:disabled{opacity:.35;cursor:default;background:none}
.ib:focus-visible,#url:focus-visible,.bm:focus-visible,.tab button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#url{flex:1;height:34px;border:1px solid transparent;border-radius:17px;padding:0 16px;background:var(--bar);color:var(--ink);font:inherit;font-size:16px}
#url:focus{border-color:var(--accent)}
#bookmarks{display:flex;gap:4px;padding:2px 8px 6px;background:var(--tab-on);border-bottom:1px solid var(--line);overflow-x:auto;min-height:30px;align-items:center}
.bm{all:unset;cursor:pointer;padding:4px 10px;border-radius:12px;white-space:nowrap;font-size:13px}
.bm:hover{background:var(--line)}
#load{height:2px;background:var(--accent);width:0;transition:width .25s}
#stage{flex:1;position:relative;background:#fff}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
iframe.on{display:block}
.home{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:var(--bg);padding:16px}
.home.on{display:flex}
.home h1{margin:0;font-size:44px;font-weight:300;letter-spacing:.04em}
.home form{width:min(560px,100%)}
.home input{width:100%;height:46px;border-radius:23px;border:1px solid var(--line);background:var(--bar);color:var(--ink);padding:0 20px;font:16px var(--font)}
.home input:focus{outline:2px solid var(--accent);border-color:transparent}
.tiles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:560px}
.tile{all:unset;cursor:pointer;width:104px;padding:14px 6px;text-align:center;border-radius:12px;background:var(--tab)}
.tile:hover{background:var(--tab-on)} .tile b{display:block;font-size:22px;margin-bottom:6px;color:var(--accent)}
.tile:focus-visible{outline:2px solid var(--accent)}
@media (prefers-reduced-motion:reduce){#load{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div id="tabs"><button id="newtab" aria-label="New tab" title="New tab">+</button></div>
  <div id="toolbar">
    <button class="ib" id="back" aria-label="Back" title="Back">&#8592;</button>
    <button class="ib" id="fwd" aria-label="Forward" title="Forward">&#8594;</button>
    <button class="ib" id="reload" aria-label="Reload" title="Reload">&#8635;</button>
    <button class="ib" id="home" aria-label="Home" title="Home">&#8962;</button>
    <input id="url" type="text" spellcheck="false" autocomplete="off" aria-label="Address or search" placeholder="Search or enter address">
    <button class="ib" id="star" aria-label="Bookmark this page" title="Bookmark this page">&#9734;</button>
  </div>
  <div id="bookmarks"></div>
  <div id="load"></div>
  <div id="stage"></div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const SEARCH = 'https://html.duckduckgo.com/html/?q=';
const DEFAULT_BM = [
  {t:'Wikipedia',u:'https://en.wikipedia.org/'},{t:'DuckDuckGo',u:'https://html.duckduckgo.com/html/'},
  {t:'Hacker News',u:'https://news.ycombinator.com/'},{t:'example.com',u:'https://example.com/'}];
let bms; try{ bms = JSON.parse(localStorage.getItem('wp-bm')) || DEFAULT_BM }catch{ bms = DEFAULT_BM }
const saveBm = () => { try{ localStorage.setItem('wp-bm', JSON.stringify(bms)) }catch{} };

let tabs = [], cur = null, nid = 1;

function normalize(raw){
  const v = raw.trim(); if(!v) return '';
  if(/^https?:\/\//i.test(v)) return v;
  if(/^[^\s]+\.[a-z]{2,}(:\d+)?([\/?#]\S*)?$/i.test(v) || /^localhost(:\d+)?/i.test(v)) return 'https://' + v;
  return SEARCH + encodeURIComponent(v);
}
const px = (u) => '/proxy?url=' + encodeURIComponent(u);

function makeTab(url){
  const t = {id:nid++, hist:[], i:-1, title:'New tab', pending:null, skip:false};
  t.el = document.createElement('div'); t.el.className='tab';
  t.el.innerHTML = '<span></span><button aria-label="Close tab" title="Close tab">&times;</button>';
  t.el.addEventListener('click', () => select(t));
  t.el.querySelector('button').addEventListener('click', (e) => { e.stopPropagation(); close(t); });
  $('#tabs').insertBefore(t.el, $('#newtab'));
  t.home = document.createElement('div'); t.home.className='home';
  t.home.innerHTML = '<h1>Windowpane</h1><form><input aria-label="Search or enter address" placeholder="Search or enter address"></form><div class="tiles"></div>';
  t.home.querySelector('form').addEventListener('submit', (e) => { e.preventDefault(); go(t, t.home.querySelector('input').value); });
  const tiles = t.home.querySelector('.tiles');
  bms.slice(0,8).forEach(b => { const x = document.createElement('button'); x.className='tile';
    x.innerHTML = '<b>'+esc(b.t[0].toUpperCase())+'</b>'+esc(b.t); x.onclick = () => go(t, b.u); tiles.appendChild(x); });
  t.frame = document.createElement('iframe');
  t.frame.setAttribute('sandbox','allow-scripts allow-forms allow-same-origin allow-popups allow-modals');
  t.frame.title = 'Page';
  t.frame.addEventListener('load', () => { if(t === cur) $('#load').style.width='0'; });
  $('#stage').append(t.home, t.frame);
  tabs.push(t); select(t);
  if(url) go(t, url); else $('#url').focus();
  return t;
}
const esc = (s) => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function select(t){
  cur = t;
  tabs.forEach(x => { x.el.classList.toggle('on', x===t); x.frame.classList.toggle('on', x===t && x.i>=0); x.home.classList.toggle('on', x===t && x.i<0); });
  sync();
}
function close(t){
  const k = tabs.indexOf(t); t.el.remove(); t.home.remove(); t.frame.remove(); tabs.splice(k,1);
  if(!tabs.length) return makeTab();
  if(cur === t) select(tabs[Math.max(0,k-1)]);
}
function sync(){
  if(!cur) return;
  const u = cur.hist[cur.i] || '';
  $('#url').value = u; $('#back').disabled = cur.i < 0; $('#fwd').disabled = cur.i >= cur.hist.length-1;
  $('#star').textContent = bms.some(b => b.u === u) ? '★' : '☆';
  cur.el.querySelector('span').textContent = cur.title;
  document.title = cur.i<0 ? 'Windowpane' : cur.title + ' – Windowpane';
}
function load(t){
  const u = t.hist[t.i];
  t.pending = u; t.skip = true;
  if(u){ t.frame.src = px(u); if(t===cur) $('#load').style.width='70%'; }
  t.home.classList.toggle('on', t===cur && !u); t.frame.classList.toggle('on', t===cur && !!u);
  if(!u) t.title = 'New tab';
  sync();
}
function go(t, raw){
  const u = normalize(raw); if(!u) return;
  t.hist = t.hist.slice(0, t.i+1); t.hist.push(u); t.i = t.hist.length-1; t.title = u.replace(/^https?:\/\//,'');
  load(t);
}
// The proxied page reports its real address and title after each load.
addEventListener('message', (e) => {
  const d = e.data; if(!d || d.type !== 'nav') return;
  const t = tabs.find(x => x.frame.contentWindow === e.source); if(!t) return;
  if(d.title) t.title = d.title;
  if(t.skip && d.url === t.pending){ t.skip = false; }
  else if(d.url !== t.hist[t.i]){
    t.hist = t.hist.slice(0, t.i+1); t.hist.push(d.url); t.i = t.hist.length-1; t.pending = d.url; t.skip = false;
  }
  if(t===cur){ $('#load').style.width='0'; sync(); } else t.el.querySelector('span').textContent = t.title;
});

function renderBm(){
  const box = $('#bookmarks'); box.textContent = '';
  if(!bms.length){ box.innerHTML = '<span style="color:var(--muted);font-size:13px">Star a page to pin it here. Right-click a bookmark to remove it.</span>'; return; }
  bms.forEach((b,k) => { const x = document.createElement('button'); x.className='bm'; x.textContent=b.t; x.title=b.u;
    x.onclick = () => go(cur, b.u);
    x.oncontextmenu = (e) => { e.preventDefault(); bms.splice(k,1); saveBm(); renderBm(); sync(); };
    box.appendChild(x); });
}

$('#url').addEventListener('keydown', (e) => { if(e.key==='Enter'){ go(cur, e.target.value); e.target.blur(); } });
$('#url').addEventListener('focus', (e) => e.target.select());
$('#newtab').onclick = () => makeTab();
$('#back').onclick = () => { if(cur.i>=0){ cur.i--; load(cur); } };
$('#fwd').onclick = () => { if(cur.i < cur.hist.length-1){ cur.i++; load(cur); } };
$('#reload').onclick = () => { if(cur.i>=0) load(cur); };
$('#home').onclick = () => { cur.hist = cur.hist.slice(0,cur.i+1); cur.hist.push(''); cur.i = cur.hist.length-1; load(cur); select(cur); };
$('#star').onclick = () => {
  const u = cur.hist[cur.i]; if(!u) return;
  const k = bms.findIndex(b => b.u === u);
  if(k>=0) bms.splice(k,1); else bms.push({t:(cur.title||u).slice(0,24), u});
  saveBm(); renderBm(); sync();
};
addEventListener('keydown', (e) => {
  const m = e.ctrlKey || e.metaKey;
  if(m && e.key==='t'){ e.preventDefault(); makeTab(); }
  if(m && e.key==='w'){ e.preventDefault(); close(cur); }
  if(m && e.key==='l'){ e.preventDefault(); $('#url').focus(); }
  if(m && e.key==='r'){ e.preventDefault(); $('#reload').click(); }
});
renderBm();
makeTab();
</script>
</body>
</html>
